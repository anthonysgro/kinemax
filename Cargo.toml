[package]
name = "kinemax"
version = "0.0.1"
edition = "2021"
rust-version = "1.74"
authors = ["Anthony Sgro"]
description = "High-performance coordinate and kinematics engine for bounded spatial tracking data."
license = "MIT"
readme = "README.md"
repository = "https://github.com/anthonysgro/kinemax"
homepage = "https://github.com/anthonysgro/kinemax"
documentation = "https://docs.rs/kinemax"
keywords = ["spatial", "kinematics", "tracking", "geometry", "telemetry"]
categories = ["science", "mathematics", "algorithms"]
exclude = [
    "python/**",
    ".venv/**",
    "target/**",
    "*.so",
    "*.dylib",
    "*.pyd",
]

[lib]
name = "kinemax"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
